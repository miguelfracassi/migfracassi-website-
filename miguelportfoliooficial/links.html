<style>
:root{
  --bg:#FFFFFF;
  --bg-2:#F4FAF5;
  --ink:#132018;
  --mut:#5B6B60;
  --line: rgba(19,32,24,0.14);
  --moss:#1E7A46;
  --denim:#1E7A46;
  --ochre:#1E7A46;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:var(--bg);
  color:var(--ink);
  font-family:'Work Sans', sans-serif;
  line-height:1.6;
  -webkit-font-smoothing:antialiased;
}
::selection{ background: var(--moss); color:#fff; }
a{ color:inherit; }
.wrap{ max-width: 980px; margin: 0 auto; padding: 0 30px; }

header.top{
  display:flex; justify-content:flex-end; align-items:center;
  padding: 28px 30px; max-width:980px; margin:0 auto;
}
nav.top-links{ display:flex; gap:4px; font-size:14.5px; font-weight:600; flex-wrap:wrap; }
nav.top-links a{
  color:var(--mut); text-decoration:none;
  padding:8px 14px; border-radius:3px;
  border-bottom: 2px solid transparent;
}
nav.top-links a:hover{ color:var(--ink); }
nav.top-links a.active{ color:var(--ink); border-color: var(--moss); }

main{ min-height: 60vh; }
.page{ padding: 20px 0 90px; }

/* hero */
.hero{ padding: 30px 0 20px; border-bottom:1px solid var(--line); margin-bottom:56px; }
.hero .eyebrow{ font-size:14px; font-weight:600; color:var(--moss); margin-bottom:18px; }
.hero h1{
  font-family:'Newsreader', serif;
  font-weight:500; font-style:normal;
  font-size: clamp(36px, 6vw, 60px);
  line-height: 1.14;
  margin: 0 0 26px;
  max-width: 16ch;
  letter-spacing: -0.01em;
}
.hero p.lede{
  font-size: 18.5px; max-width: 56ch; color: var(--mut);
  margin: 0 0 36px;
}
.dual-cta{ display:flex; gap:12px; flex-wrap:wrap; margin-bottom:44px; }
.cta{
  display:inline-flex; align-items:center; gap:9px;
  padding: 13px 22px; border-radius: 3px;
  text-decoration:none; font-size:14.5px; font-weight:600;
  border:1.5px solid var(--ink);
  background:transparent; color:var(--ink);
  transition: background 0.15s ease, color 0.15s ease;
}
.cta:hover{ background:var(--ink); color:var(--bg); }
.cta.solid{ background:var(--ink); color:var(--bg); }
.cta.solid:hover{ background:transparent; color:var(--ink); }

.stat-row{
  display:flex; gap:0; flex-wrap:wrap;
  border-top:1px solid var(--line);
}
.stat{
  flex:1; min-width:150px; padding: 20px 22px 20px 0;
  border-right:1px solid var(--line);
}
.stat:last-child{ border-right:none; }
.stat .n{ font-family:'Newsreader', serif; font-size:30px; font-weight:500; color:var(--moss); }
.stat .l{ font-size:13px; color:var(--mut); margin-top:4px; }

.tracks{
  display:grid; grid-template-columns: 1fr 1fr 1fr; gap:1px;
  background:var(--line);
  border:1px solid var(--line);
  margin: 0 0 60px;
}
@media (max-width: 860px){ .tracks{ grid-template-columns: 1fr; } }
.track{
  background: var(--bg-2); padding: 30px 28px;
  text-decoration:none; color:var(--ink); display:block;
}
.track .eyebrow{ font-weight:600; font-size:13px; margin-bottom:14px; color:var(--denim); }
.track h3{ font-family:'Newsreader', serif; font-weight:500; font-size:24px; margin:0 0 10px; }
.track p{ font-size:14.5px; color:var(--mut); margin:0 0 14px; }
.track .go{ font-size:13.5px; font-weight:600; color:var(--moss); }

.section{ margin-bottom: 62px; }
.section-head{ margin-bottom: 28px; }
.section-head .eyebrow{ font-weight:600; font-size:13.5px; color:var(--moss); margin-bottom:10px; }
.section-head h2{ font-family:'Newsreader', serif; font-weight:500; font-size: clamp(28px,4vw,40px); margin:0 0 14px; max-width:20ch;}
.section-head p{ font-size:16.5px; color:var(--mut); max-width:60ch; margin:0; }

.body-copy p{ max-width:66ch; font-size:16.5px; color:var(--mut); margin:0 0 18px; }
.body-copy p:last-child{ margin-bottom:0; }

.value-grid{ display:grid; grid-template-columns: 1fr 1fr; gap: 30px 40px; margin-top:36px; }
@media (max-width:700px){ .value-grid{ grid-template-columns: 1fr; } }
.value{ border-top:1px solid var(--line); padding-top:16px; }
.value h4{ font-family:'Newsreader', serif; font-weight:500; font-size:19px; margin:0 0 8px; }
.value p{ font-size:14.5px; color:var(--mut); margin:0; }

.timeline{ margin-top:36px; }
.tl-item{
  display:grid; grid-template-columns: 90px 1fr; gap:22px;
  padding: 22px 0; border-top:1px solid var(--line);
}
.tl-item:first-child{ border-top:none; }
.tl-item .when{ font-family:'Newsreader', serif; font-size:19px; color:var(--moss); }
.tl-item h4{ margin:0 0 6px; font-size:16px; font-weight:600; }
.tl-item p{ margin:0; font-size:14.5px; color:var(--mut); max-width:56ch; }

.info-list{ list-style:none; margin: 26px 0; padding:0; max-width:560px; }
.info-list li{
  display:flex; justify-content:space-between; gap:14px;
  padding: 15px 0; border-top:1px solid var(--line); font-size:15px;
}
.info-list li:first-child{ border-top:none; }
.info-list li span:first-child{ color:var(--mut); }
.info-list li span:last-child{ font-weight:600; }

.skill-grid{ display:grid; grid-template-columns: repeat(3,1fr); gap:14px; margin: 30px 0 40px; }
@media (max-width:700px){ .skill-grid{ grid-template-columns: repeat(2,1fr); } }
.skill{ border:1px solid var(--line); padding:16px 18px; border-radius:3px; font-size:14px; }
.skill b{ display:block; font-family:'Newsreader', serif; font-size:16px; font-weight:500; margin-bottom:4px; }
.skill span{ color:var(--mut); }

.partner-grid{ display:grid; grid-template-columns: repeat(3,1fr); gap:14px; margin-top:30px; }
@media (max-width:700px){ .partner-grid{ grid-template-columns: repeat(2,1fr); } }
.partner{
  border:1.5px dashed var(--line); border-radius:3px;
  padding: 20px 16px; text-align:center; font-size:12.5px; color:var(--mut);
}
.partner b{ display:block; font-family:'Newsreader', serif; font-size:15px; font-weight:500; color:var(--ink); margin-bottom:4px; }

.contact-cards{ display:flex; gap:14px; flex-wrap:wrap; margin-top: 20px; }
.contact-card{
  flex:1; min-width:230px;
  background: var(--bg-2); border:1px solid var(--line); border-radius:3px;
  padding: 24px 26px;
  display:flex; align-items:center; gap:16px;
  text-decoration:none; color:var(--ink);
}
.contact-card .icon{
  width:44px; height:44px; border-radius:50%;
  display:flex; align-items:center; justify-content:center;
  flex-shrink:0; font-size:19px;
  background: rgba(47,107,74,0.12);
}
.contact-card .label{ font-size:12.5px; color:var(--mut); margin-bottom:2px; font-weight:600; }
.contact-card .value{ font-family:'Newsreader', serif; font-weight:500; font-size:17px; }

.hours{ margin-top:40px; border-top:1px solid var(--line); padding-top:24px; }
.hours h4{ font-family:'Newsreader', serif; font-weight:500; font-size:19px; margin:0 0 10px; }
.hours p{ font-size:14.5px; color:var(--mut); max-width:50ch; margin:0; }

.admin-bar{ background:#17123A; padding: 24px 0; margin-top: 20px; }
.admin-bar .wrap{ display:flex; align-items:center; gap:10px; font-size:13.5px; color:#C9C6DA; }
.admin-bar img{ height:16px; width:auto; filter: brightness(0) invert(1); opacity:0.92; }


.linktree{ max-width: 480px; margin: 0 auto; padding: 60px 0 90px; text-align:center; }
.lt-avatar{
  width:96px; height:96px; border-radius:50%;
  background: var(--moss); color:#fff;
  display:flex; align-items:center; justify-content:center;
  font-family:'Newsreader', serif; font-weight:600; font-size:38px;
  margin: 0 auto 18px;
}
.lt-name{ font-family:'Newsreader', serif; font-weight:500; font-size:26px; margin-bottom:6px; }
.lt-sub{ font-size:14.5px; color:var(--mut); margin-bottom:38px; }
.lt-btn{
  display:block; width:100%; text-align:center;
  padding: 16px 20px; margin-bottom:14px;
  border-radius: 100px; border:1.5px solid var(--moss);
  color: var(--ink); text-decoration:none; font-weight:600; font-size:15px;
  transition: background 0.15s ease, color 0.15s ease;
}
.lt-btn:hover{ background: var(--moss); color:#fff; }
.lt-btn .sub{ display:block; font-size:12px; font-weight:500; color:var(--mut); margin-top:3px; }
.lt-btn:hover .sub{ color: rgba(255,255,255,0.85); }
.lt-btn.disabled{
  border-color: var(--line); color: var(--mut); cursor:not-allowed;
  pointer-events:none; opacity:0.6;
}

</style>

<script>
  (function(){
    // Target: 19/09/2026 20:00 horário de Brasília (UTC-3)
    var target = new Date("2026-09-19T20:00:00-03:00").getTime();
    function checkExpiry(){
      var btn = document.getElementById('btn-mutirao');
      if(!btn) return;
      if(Date.now() >= target){
        btn.classList.add('disabled');
        btn.removeAttribute('href');
        btn.removeAttribute('target');
        var sub = btn.querySelector('.sub');
        if(sub) sub.textContent = 'encerrado';
      }
    }
    checkExpiry();
    setInterval(checkExpiry, 60000);
  })();
</script>
